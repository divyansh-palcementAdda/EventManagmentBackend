spring.application.name=EventManagmnetSystem-Test

# Test DB using in-memory H2 with MySQL compatibility
spring.datasource.url=jdbc:h2:mem:event_pass_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate in test: create-drop for quick in-memory schema verification
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Flyway disabled in H2 test profile to prevent MySQL-specific syntax conflicts in H2
spring.flyway.enabled=false

# JWT test secret (>= 256 bits)
app.jwt.secret=D4F5A8B2C9E1D3F7A6B5C4E3D2F1A0B9C8E7D6F5A4B3C2D1E0F9A8B7C6D5E4F3
app.jwt.access-token-expiry-ms=3600000
app.jwt.refresh-token-expiry-ms=86400000
app.jwt.issuer=eventpass-test

# Bootstrap disabled in test
app.bootstrap.enabled=false

# Mail
spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=test@eventpass.local

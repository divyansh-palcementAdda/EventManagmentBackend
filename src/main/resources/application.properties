spring.application.name=EventManagmnetSystem

# ===== SERVER =====
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ===== DATASOURCE =====
spring.datasource.url=${EVENTPASS_DB_URL:jdbc:mysql://localhost:3306/event_pass_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${EVENTPASS_DB_USERNAME:root}
spring.datasource.password=${EVENTPASS_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ===== JWT =====
app.jwt.secret=${EVENTPASS_JWT_SECRET:CHANGE_THIS_IN_PRODUCTION_USE_ENV_VAR_MIN_256_BITS}
app.jwt.access-token-expiry-ms=${EVENTPASS_JWT_ACCESS_EXPIRY_MS:900000}
app.jwt.refresh-token-expiry-ms=${EVENTPASS_JWT_REFRESH_EXPIRY_MS:604800000}
app.jwt.issuer=eventpass

# ===== MAIL =====
spring.mail.host=${EVENTPASS_MAIL_HOST:localhost}
spring.mail.port=${EVENTPASS_MAIL_PORT:1025}
spring.mail.username=${EVENTPASS_MAIL_USERNAME:}
spring.mail.password=${EVENTPASS_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${EVENTPASS_MAIL_FROM:noreply@eventpass.local}
app.mail.outbox.batch-size=10
app.mail.outbox.max-attempts=5
app.mail.outbox.poll-delay-ms=30000

# ===== CORS =====
app.cors.allowed-origins=${EVENTPASS_CORS_ORIGINS:http://localhost:5173,http://192.168.1.13:5173,https://event.areyoureporting.com,http://192.168.1.8:5173}

# ===== BOOTSTRAP / SEED DATA =====
app.bootstrap.enabled=${EVENTPASS_BOOTSTRAP_ENABLED:true}
app.bootstrap.admin.email=${EVENTPASS_BOOTSTRAP_ADMIN_EMAIL:Admin@gmail.com}
app.bootstrap.admin.password=${EVENTPASS_BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
app.bootstrap.admin.fullname=${EVENTPASS_BOOTSTRAP_ADMIN_FULLNAME:System Administrator}
app.bootstrap.gatekeeper.email=${EVENTPASS_BOOTSTRAP_GATEKEEPER_EMAIL:Gatekepper@gmail.com}
app.bootstrap.gatekeeper.password=${EVENTPASS_BOOTSTRAP_GATEKEEPER_PASSWORD:Gatekeeper@123}
app.bootstrap.gatekeeper.fullname=${EVENTPASS_BOOTSTRAP_GATEKEEPER_FULLNAME:Demo Gatekeeper}

# ===== OPENAPI / SWAGGER =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ===== LOGGING =====
logging.level.com.app.eventmanagmentsystem=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
